# 德州子游戏 — 独立 compose 项目,与扯旋(chexuan)互不影响
# 部署目录: /home/fzcx/cx-dzpk (每个子游戏单独一个文件夹,与 /home/fzcx/chexuan 平级)
# 宿主端口 19100 → 容器 9100
#
# 数据库:独立库 cx_dzpk(自动建库),与主库 chexuan_game 同一 MySQL 实例;
#   挂进扯旋的 chexuan-net 网络直连 mysql:3306(容器别名),不占宿主端口。
#   账号/钻石独立(dz_user 本库),不再跨库扯旋主库。
# MinIO:复用扯旋栈的 chexuan-minio(容器网络 minio:9000),独立桶 cx-dzpk;
#   外网走 nginx 域名 cxchat.cocoaihj.com(预签名直传,聊天独立后媒体共用)。
services:
  dzpk:
    build: .
    container_name: cx-dzpk
    ports:
      - "19100:9100"
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/cx_dzpk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Fz2025qq@"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: https://cxchat.cocoaihj.com
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cx-dzpk
    networks:
      - default
      - chexuan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  chexuan-net:
    external: true
