spring:
  application:
    name: chexuan-dzpk

  # 数据库 — 独立库 cx_dzpk:账号(dz_user)/钻石/战绩/钱包全部本库,与扯旋完全独立。
  # 开发默认 H2 内存库(MODE=MySQL,零配置起服);生产用环境变量覆盖:
  #   SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cx_dzpk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
  #   SPRING_DATASOURCE_USERNAME=root  SPRING_DATASOURCE_PASSWORD=***
  datasource:
    url: jdbc:h2:mem:dzpk;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # schema.sql 全部 CREATE TABLE IF NOT EXISTS;CREATE INDEX 重复报错忽略(MySQL 无 IF NOT EXISTS)
      continue-on-error: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

server:
  port: 9100

# ========================================
# 德州子游戏服务配置
# ========================================
dzpk:
  # 独立账号体系:本服自签自验 JWT(与扯旋主服无关);生产用环境变量覆盖成独立密钥
  jwt-secret: "CxDzpk2026IndependentJwtSecretKey9100"
  # token 有效期(天)
  jwt-expire-days: 7
  # 开发模式:允许无 token 的游客登录(guest:昵称),联调用;上线关掉
  allow-guest: true
  # 玩家行动思考时间(秒),老德州 room.xml opTime 默认 15,+3 秒网络余量在前端做
  action-timeout-secs: 15
  # 一手结束到下一手开始的间隔(秒)
  next-hand-delay-secs: 4
  # 周期结算/打光后,补带入等待时长(秒),超时自动站起(对齐扯旋 period_settle_bringin_seconds=10)
  await-buyin-secs: 10

  # ---------- 留座暂离/放假(对齐扯旋 seatReserve) ----------
  # 放假倒计时(秒),每结算周期只能用一次,超时自动站起
  seat-reserve-grace-secs: 300
  # 放假超时站起后,座位再物理保留给本人的时长(秒)
  seat-lock-secs: 480

  # ---------- 赢家离桌罚金(对齐扯旋 284,仅俱乐部房) ----------
  # 赢家早退过路费率%(盈利离桌扣给群主)
  winner-early-leave-rate: 30
  # 逃跑罚金开关(累计离线过长再离桌加罚,扯旋默认关)
  run-away-enabled: false
  run-away-time-mins: 6
  run-away-penalty-rate: 30

  # ---------- 圈主周期扣钻(对齐扯旋 commission_settle_diamond_cost) ----------
  # 每结算周期扣群主钻石(俱乐部房第一手预付+到点续扣);0=不扣。
  # 群主无主服账号(开发/机器人环境)自动跳过。
  owner-period-diamond-cost: 5

  # 机器人(陪打测试)
  robot:
    enabled: true
    # 每个房间补足的机器人数量(有真人在座才进场,真人全走自动撤)
    fill-count: 2
    # 行动延迟范围(毫秒),拟真思考时间
    min-delay-ms: 800
    max-delay-ms: 2500
  # 游客/新钱包初始金币(dz_user_wallet 首次访问时的初始余额;上线接主服积分后置 0)
  guest-init-balance: 1000000
  # 创建房间扣钻石(dz_user.diamond,原子扣减 + dz_diamond_log 流水);0=不扣。
  # 游客/机器人(id>=8亿)没有账号,不扣。
  create-room-diamond-cost: 0
  # 钻石所在的用户表:独立账号体系固定 dz_user(账号与钻石都在本库)
  diamond-user-table: "dz_user"
  # 创建俱乐部扣钻石(扯旋普通俱乐部 200 钻);0=不扣
  create-club-diamond-cost: 0
  # 每人最多创建俱乐部数(对齐扯旋默认 10)
  max-club-per-user: 10

logging:
  level:
    com.chexuan.dzpk: debug
