spring:
  application:
    name: chexuan-dzpk

  # 数据库 — 战绩/结算/钱包落库 + 钻石公用。
  # 架构:每个子游戏独立一个库(德州=cx_dzpk),与主库 chexuan_game 同一 MySQL 实例;
  #   钻石本体在主库 user.diamond,德州跨库原子扣减(见 dzpk.diamond-user-table)。
  # 开发默认 H2 内存库(MODE=MySQL,零配置起服);生产用环境变量覆盖:
  #   SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cx_dzpk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
  #   SPRING_DATASOURCE_USERNAME=root  SPRING_DATASOURCE_PASSWORD=***
  #   DZPK_DIAMOND_USER_TABLE=chexuan_game.user
  datasource:
    url: jdbc:h2:mem:dzpk;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # schema.sql 全部 CREATE TABLE IF NOT EXISTS;CREATE INDEX 重复报错忽略(MySQL 无 IF NOT EXISTS)
      continue-on-error: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

server:
  port: 9100

# ========================================
# 德州子游戏服务配置
# ========================================
dzpk:
  # 与主服(chexuan-springboot JwtUtil)相同的 JWT 密钥,本地验签,不回主服校验
  jwt-secret: "ChexuanGame2025SecretKeyForJWT123456"
  # 开发模式:允许无 token 的游客登录(guest:昵称),联调用;上线关掉
  allow-guest: true
  # 玩家行动思考时间(秒),老德州 room.xml opTime 默认 15,+3 秒网络余量在前端做
  action-timeout-secs: 15
  # 一手结束到下一手开始的间隔(秒)
  next-hand-delay-secs: 4
  # 周期结算/打光后,补带入等待时长(秒),超时自动站起
  await-buyin-secs: 30

  # 机器人(陪打测试)
  robot:
    enabled: true
    # 每个房间补足的机器人数量(有真人在座才进场,真人全走自动撤)
    fill-count: 2
    # 行动延迟范围(毫秒),拟真思考时间
    min-delay-ms: 800
    max-delay-ms: 2500
  # 游客/新钱包初始金币(dz_user_wallet 首次访问时的初始余额;上线接主服积分后置 0)
  guest-init-balance: 1000000
  # 创建房间扣钻石(主库 user.diamond,原子扣减 + dz_diamond_log 流水);0=不扣。
  # 游客/机器人(id>=8亿)没有主服账号,不扣。
  create-room-diamond-cost: 0
  # 钻石所在的用户表(钻石公用核心):开发 H2 用本库最小 user 表;
  # 生产配 chexuan_game.user 跨库直达主服钻石。
  diamond-user-table: "`user`"

logging:
  level:
    com.chexuan.dzpk: debug
