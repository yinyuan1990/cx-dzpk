<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>德州子游戏联调页</title>
<style>
  body { font-family: Consolas, monospace; background: #1b1f24; color: #d8dee9; margin: 0; display: flex; height: 100vh; }
  .left { width: 340px; padding: 12px; border-right: 1px solid #333; overflow-y: auto; }
  .right { flex: 1; display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.5; }
  #log .in { color: #88c0d0; }
  #log .out { color: #a3be8c; }
  #log .err { color: #bf616a; }
  fieldset { border: 1px solid #444; margin-bottom: 10px; border-radius: 4px; }
  legend { color: #ebcb8b; font-size: 13px; }
  input, select { background: #2e3440; color: #eee; border: 1px solid #555; padding: 4px 6px; margin: 2px 0; width: 90px; }
  input.wide { width: 200px; }
  button { background: #3b4252; color: #eee; border: 1px solid #666; padding: 5px 10px; margin: 2px; cursor: pointer; border-radius: 3px; }
  button:hover { background: #4c566a; }
  button.act { background: #5e81ac; }
  #state { padding: 8px 12px; background: #21262c; border-bottom: 1px solid #333; font-size: 12px; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }
</style>
</head>
<body>
<div class="left">
  <fieldset><legend>连接 / 登录</legend>
    <input id="wsUrl" class="wide" value="">
    <button onclick="connect()">连接</button><br>
    <input id="guestNick" placeholder="游客昵称" value="测试员A">
    <button onclick="loginGuest()">游客登录</button><br>
    <input id="token" class="wide" placeholder="主服JWT(可选)">
    <button onclick="loginToken()">Token登录</button>
  </fieldset>
  <fieldset><legend>房间</legend>
    <button onclick="send({type:402})">房间列表</button><br>
    盲注 <input id="sb" value="50">/<input id="bb" value="100"><br>
    结算时间(分) <input id="settleMins" value="30"> 抽水% <input id="rake" value="5"><br>
    <button onclick="createRoom()">创建房间</button><br>
    房号 <input id="roomId">
    <button onclick="send({type:404, roomId: rid()})">进房</button>
    <button onclick="send({type:405, roomId: rid()})">离开</button>
  </fieldset>
  <fieldset><legend>座位 / 带入</legend>
    座位 <input id="seat" value="0">
    <button onclick="send({type:406, roomId: rid(), data:{seat:+v('seat')}})">坐下</button><br>
    金额 <input id="buyin" value="10000">
    <button onclick="send({type:407, roomId: rid(), data:{amount:+v('buyin')}})">带入</button>
    <button onclick="send({type:408, roomId: rid()})">站起</button><br>
    <button onclick="send({type:410, roomId: rid()})">拉快照</button>
  </fieldset>
  <fieldset><legend>行动</legend>
    <button class="act" onclick="act('fold')">弃牌</button>
    <button class="act" onclick="act('check')">过牌</button>
    <button class="act" onclick="act('call')">跟注</button><br>
    加注到 <input id="raiseTo" value="300">
    <button class="act" onclick="act('raise', +v('raiseTo'))">加注</button>
    <button class="act" onclick="act('allin')">全下</button>
  </fieldset>
</div>
<div class="right">
  <div id="state">未连接</div>
  <div id="log"></div>
</div>
<script>
let ws = null;
const TYPE_NAMES = {401:'登录',402:'房间列表',403:'建房',404:'进房',405:'离开',406:'坐下',407:'带入',408:'站起',409:'行动',410:'快照',
  451:'登录OK',452:'房间列表',453:'建房OK',454:'进房快照',455:'有人进房',456:'有人坐下',457:'带入结果',458:'开局',459:'手牌',
  460:'轮到行动',461:'行动广播',462:'发公共牌',463:'摊牌',464:'一手结算',465:'有人站起',466:'快照',467:'有人离开',
  468:'周期结算',469:'房态',499:'错误'};

document.getElementById('wsUrl').value = 'ws://' + location.host + '/ws/dzpk';
function v(id){ return document.getElementById(id).value.trim(); }
function rid(){ return +v('roomId') || 0; }

function logLine(cls, text){
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  const box = document.getElementById('log'); box.appendChild(d); box.scrollTop = box.scrollHeight;
}

function connect(){
  if (ws) ws.close();
  ws = new WebSocket(v('wsUrl'));
  ws.onopen = () => logLine('in', '== 已连接 ==');
  ws.onclose = () => logLine('err', '== 连接断开 ==');
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    logLine('in', '← [' + (TYPE_NAMES[m.type]||m.type) + '] ' + JSON.stringify(m.data));
    if (m.type === 453 && m.data.roomId) document.getElementById('roomId').value = m.data.roomId;
    if (m.type === 454 || m.type === 466) renderState(m.data);
    if (m.type === 459) logLine('out', '★ 我的手牌: ' + m.data.cards.join(' '));
    if (m.type === 460) logLine('out', '★ 轮到座位 ' + m.data.seat + ' 行动, 需跟 ' + m.data.toCall + ', 最小加注到 ' + m.data.minRaiseTo);
    if (m.type === 464) logLine('out', '★ 结算: ' + JSON.stringify(m.data.results||m.data));
    if (m.type === 468) logLine('out', '★ 周期结算: 盈亏' + m.data.profit + ' 抽水' + m.data.rake + ' 退回' + m.data.refund + ', ' + m.data.awaitBuyinSecs + '秒内补带入否则站起');
  };
}

function send(obj){
  if (!ws || ws.readyState !== 1) { logLine('err', '未连接'); return; }
  ws.send(JSON.stringify(obj));
  logLine('out', '→ [' + (TYPE_NAMES[obj.type]||obj.type) + '] ' + JSON.stringify(obj.data||{}));
}
function loginGuest(){ send({type:401, data:{guest: v('guestNick')}}); }
function loginToken(){ send({type:401, data:{token: v('token')}}); }
function createRoom(){
  send({type:403, data:{name: v('guestNick')+'的牌局', sb:+v('sb'), bb:+v('bb'),
    maxPlayers:9, settleTimeMins:+v('settleMins'), rakePercent:+v('rake')}});
}
function act(a, amount){ send({type:409, roomId: rid(), data:{act:a, amount: amount||0}}); }

function renderState(s){
  let t = '房间 ' + s.roomId + ' [' + s.name + '] 盲注 ' + s.sb + '/' + s.bb
    + ' 结算周期 ' + s.settleTimeMins + '分 抽水 ' + s.rakePercent + '%\n'
    + '阶段 ' + s.stage + '  手数 ' + s.handNo + '  庄位 ' + s.button
    + '  公共牌 [' + (s.board||[]).join(' ') + ']  底池 ' + s.pot + '\n';
  for (const p of (s.seats||[])) {
    t += '  座' + p.seat + ' ' + p.nickname + '(' + p.userId + ') 筹码' + p.stack
      + (p.inHand ? (p.folded?' 已弃':' 在手') : ' 旁观')
      + (p.allIn?' 全下':'') + (p.awaitingBuyin?' 待补带入':'')
      + ' 本轮注' + p.betThisRound + ' 已玩' + p.effectiveSecs + 's'
      + (p.cards ? ' 手牌[' + p.cards.join(' ') + ']' : '') + '\n';
  }
  document.getElementById('state').textContent = t;
}
</script>
</body>
</html>
